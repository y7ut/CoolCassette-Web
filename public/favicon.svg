<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <defs>

    <!-- 定义一个与磁带主体形状完全一致的裁剪路径 -->

    <clipPath id="body-clip">

      <rect x="2" y="2" width="28" height="28" rx="2" />

    </clipPath>

  </defs>
  <rect width="32" height="32" fill="#d1e1a5"/>
  <!-- cassette body (square) -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#000000"/>
  <!-- label area -->
  <rect x="5" y="5" width="22" height="18" fill="#000000"/>
  <!-- CC letters (pixel art, chamfered corners, bold) -->
  <g fill="#c8f542">
    <!-- C left -->
    <rect x="6" y="9" width="8" height="2"/>
    <rect x="5" y="10" width="2" height="1"/>
    <rect x="5" y="10" width="2" height="8"/>
    <rect x="6" y="17" width="8" height="2"/>
  </g>
  <g fill="#d1e1a5">
    <!-- C right -->
    <rect x="18" y="9" width="8" height="2"/>
    <rect x="17" y="10" width="2" height="1"/>
    <rect x="17" y="10" width="2" height="8"/>
    <rect x="18" y="17" width="8" height="2"/>
  </g>
    <g clip-path="url(#body-clip)">
  <g>
    <!-- diagonal highlight 1 (/ shape) -->
    <rect x="2" y="29" width="2" height="1" fill="#ffffff" opacity="0.17"/>
    <rect x="3" y="27" width="2" height="2" fill="#ffffff" opacity="0.16"/>
    <rect x="4" y="25" width="2" height="2" fill="#ffffff" opacity="0.15"/>
    <rect x="5" y="23" width="2" height="2" fill="#ffffff" opacity="0.14"/>
    <rect x="6" y="21" width="2" height="2" fill="#ffffff" opacity="0.13"/>
    <rect x="7" y="19" width="2" height="2" fill="#ffffff" opacity="0.12"/>
    <rect x="8" y="17" width="2" height="2" fill="#ffffff" opacity="0.11"/>
    <rect x="9" y="15" width="2" height="2" fill="#ffffff" opacity="0.10"/>
    <rect x="10" y="13" width="2" height="2" fill="#ffffff" opacity="0.09"/>
    <rect x="11" y="11" width="2" height="2" fill="#ffffff" opacity="0.08"/>
    <rect x="12" y="9" width="2" height="2" fill="#ffffff" opacity="0.07"/>
    <rect x="13" y="7" width="2" height="2" fill="#ffffff" opacity="0.06"/>
    <rect x="14" y="5" width="2" height="2" fill="#ffffff" opacity="0.05"/>
    <rect x="15" y="3" width="2" height="2" fill="#ffffff" opacity="0.04"/> 
    <rect x="16" y="2" width="2" height="1" fill="#ffffff" opacity="0.03"/> 
  </g>

  <!-- diagonal highlight 2 (/ shape, offset right) -->
  <rect x="7" y="29" width="2" height="1" fill="#ffffff" opacity="0.13"/>
  <rect x="8" y="27" width="2" height="2" fill="#ffffff" opacity="0.12"/>
  <rect x="9" y="25" width="2" height="2" fill="#ffffff" opacity="0.11"/>
  <rect x="10" y="23" width="2" height="2" fill="#ffffff" opacity="0.10"/>
  <rect x="11" y="21" width="2" height="2" fill="#ffffff" opacity="0.09"/>
  <rect x="12" y="19" width="2" height="2" fill="#ffffff" opacity="0.08"/>
  <rect x="13" y="17" width="2" height="2" fill="#ffffff" opacity="0.07"/>
  <rect x="14" y="15" width="2" height="2" fill="#ffffff" opacity="0.06"/>
  <rect x="15" y="13" width="2" height="2" fill="#ffffff" opacity="0.05"/>
  <rect x="16" y="11" width="2" height="2" fill="#ffffff" opacity="0.04"/>
  <rect x="17" y="9" width="2" height="2" fill="#ffffff" opacity="0.03"/>
  <rect x="18" y="7" width="2" height="2" fill="#ffffff" opacity="0.02"/>
  <rect x="19" y="5" width="2" height="2" fill="#ffffff" opacity="0.01"/>
  <!-- head gap -->
  <rect x="7" y="24" width="18" height="1" fill="#c8f542"/>
  </g>
</svg>
