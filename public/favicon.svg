<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <rect width="32" height="32" fill="none"/>
  <!-- cassette body -->
  <rect x="2" y="6" width="28" height="20" rx="2" fill="#000000"/>
  <!-- label area -->
  <rect x="5" y="9" width="22" height="10" fill="#000000"/>
  <!-- CC letters (pixel art, chamfered corners, bold) -->
  <g fill="#39ff14">
    <!-- C left -->
    <rect x="7" y="11" width="7" height="2"/>
    <rect x="6" y="12" width="2" height="1"/>
    <rect x="6" y="12" width="2" height="6"/>
    <rect x="7" y="17" width="7" height="2"/>
  </g>
  <g fill="#6ab35d">    1!-- C right -->
    <rect x="18" y="11" width="7" height="2"/>
    <rect x="17" y="12" width="2" height="1"/>
    <rect x="17" y="12" width="2" height="6"/>
    <rect x="18" y="17" width="7" height="2"/>
  </g>
  <!-- bottom housing -->
  <!-- <rect x="5" y="21" width="22" height="3" fill="#0f0d0d"/> -->
  <!-- head gap -->
  <rect x="7" y="22" width="18" height="1" fill="#202421"/>
  <!-- screws -->
  <rect x="4" y="7" width="1" height="1" fill="#555"/>
  <rect x="27" y="7" width="1" height="1" fill="#555"/>
  <rect x="4" y="24" width="1" height="1" fill="#555"/>
  <rect x="27" y="24" width="1" height="1" fill="#555"/>
</svg>
